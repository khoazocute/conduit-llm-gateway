spring:
  application:
    name: backend-gateway

  datasource:
    url: jdbc:postgresql://localhost:5432/conduit
    username: conduit
    password: conduit
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: localhost
      # Host port của redis trong docker-compose là 26379 (không phải 6379
      # mặc định) — xem chú thích trong docker-compose.yml.
      port: 26379

server:
  port: 8081
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-please-32-bytes-minimum-secret-key}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:20}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

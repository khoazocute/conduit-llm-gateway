spring:
  application:
    name: backend-gateway

  datasource:
    url: jdbc:postgresql://localhost:5432/conduit
    username: conduit
    password: conduit
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: localhost
      # Host port của redis trong docker-compose là 26379 (không phải 6379
      # mặc định) — xem chú thích trong docker-compose.yml.
      port: 26379

server:
  port: 8081
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-please-32-bytes-minimum-secret-key}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:20}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
  webhook:
    mock-secret: ${MOCK_WEBHOOK_SECRET:dev-only-mock-webhook-secret}
  security:
    api-key-encryption-secret: ${API_KEY_ENCRYPTION_SECRET:dev-only-api-key-encryption-secret}
  chat:
    # Proxy "active" hien la cau hinh tinh, khong phai routing thong minh -
    # quyet dinh that thuoc Tuan 9-10 (CLAUDE.md muc 2/8).
    # D3: thi nghiem chay qua app, doi proxy theo tung dot chay bang CHAT_ACTIVE_PROXY.
    active-proxy: ${CHAT_ACTIVE_PROXY:litellm}
    # H3: gpt-4o-mini la mac dinh chinh thuc (gemini-flash chi la tam luc test Gemini
    # tuan truoc). Env override de thu routing that (VD conduit-pool, H1) ma khong
    # phai sua file/commit gia tri tam.
    # TASK-51 (2026-10-27): truoc day mac dinh gpt-4o-mini cho MOI proxy -> chat thuong qua LiteLLM
    # goi thang alias gpt-4o-mini, KHONG qua conduit-pool (khong cost-based-routing, khong
    # fallbacks); thi nghiem dung conduit-pool chi nho dry_run.sh dat bien moi truong. Gio de rong
    # = lay theo proxy-default-models ben duoi; dat CHAT_DEFAULT_MODEL thi gia tri do thang (giu
    # nguyen cach dry_run.sh tai lap thi nghiem).
    default-model: ${CHAT_DEFAULT_MODEL:}
    proxy-default-models:
      litellm: conduit-pool
    # D7 (docs/experiment-design.md muc 3): max_tokens gui kem MOI request, giong nhau ca 3 proxy.
    # Truoc 2026-10-16 backend chua gui bao gio nen D7 chua tung duoc thuc thi qua duong app.
    # 1024 (nang tu 512 ngay 2026-10-16, D12 bo sung). Ly do do duoc: claude-haiku
    # (tier MEDIUM) viet 855 token lap luan cho mmlu_01 -> o 512 bi cat TRUOC KHI kip
    # dua dap an => truot vi NGAN SACH chu khong phai vi sai. O 1024: 0/10 item MMLU bi
    # cat, 10/10 trich duoc dap an, 8/10 dung = do nang luc that. Gan nhu khong ton them
    # vi 9/10 item haiku tra loi dung 4 token (10 luot = $0.0056).
    max-tokens: ${CHAT_MAX_TOKENS:1024}
    # D7: greedy decoding (protocol pass@1 doi temperature 0). Am = khong gui.
    # claude-sonnet-5 tu choi tham so nay nen da bi bo khoi moi duong dinh tuyen.
    temperature: ${CHAT_TEMPERATURE:0}
    proxy-base-urls:
      litellm: http://localhost:4000/v1
      bifrost: ${BIFROST_BASE_URL:http://localhost:8080/v1}
      portkey: http://localhost:8787/v1
    proxy-api-keys:
      litellm: ${LITELLM_MASTER_KEY:sk-1234}
    # Portkey khong dung Bearer token - doc Config object tu file nay, tu thay
    # $VAR bang gia tri that (Portkey OSS khong tu lam viec do, xem H2/H3).
    # Duong dan tinh theo working dir luc chay (backend-gateway/), override neu
    # chay tu thu muc khac.
    portkey-config-path: ${PORTKEY_CONFIG_PATH:../proxy-configs/portkey/config.json}
    # Backend va model_pricing dung alias cua LiteLLM; Bifrost khong co alias,
    # can ten "provider/model" that - phai khop proxy-configs/litellm/config.yaml.
    proxy-model-names:
      bifrost:
        gpt-4o-mini: openai/gpt-4o-mini
        gpt-4o: openai/gpt-4o
        claude-haiku: anthropic/claude-haiku-4-5-20251001
        claude-sonnet: anthropic/claude-sonnet-5
        gemini-flash: gemini/gemini-flash-latest
    # D2: Bifrost khong tu chon model nen dung chuoi fallback tinh, xep theo gia that
    # re -> dat (docs/model-pricing-sources.md). Model chinh = model duoc yeu cau; cac
    # model con lai gui kem trong "fallbacks" theo dung thu tu nay.
    proxy-fallback-chains:
      # claude-sonnet DA BO khoi chuoi (2026-10-16, D12): no tu choi tham so temperature
      # (HTTP 400) ma backend gio gui temperature kem moi request -> de trong chuoi la de
      # lai min: model re loi thi Bifrost leo toi sonnet roi 400. Xem docs/roadmap.md D12.
      bifrost: [gpt-4o-mini, gemini-flash, claude-haiku, gpt-4o]

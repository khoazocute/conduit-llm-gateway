# LiteLLM proxy config — 5-model pool, 2 cost tiers (CLAUDE.md mục 2).
# Routing thật đã cấu hình (Phase C, D2/D7 — xem docs/roadmap.md mục 4).

model_list:
  # 5 alias riêng lẻ — vẫn giữ để chat thường (app.chat.default-model) gọi thẳng
  # 1 model cụ thể, không đi qua routing.
  # Tầng rẻ
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY

  # Tầng trung
  - model_name: claude-haiku
    litellm_params:
      # claude-3-5-haiku-20241022 đã bị Anthropic gỡ (verify 2026-09-23 qua
      # GET /v1/models, không còn trong danh sách trả về). Đổi sang bản còn hỗ trợ.
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # Tầng đắt
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: claude-sonnet
    litellm_params:
      # claude-3-5-sonnet-20241022 đã bị gỡ, lý do như trên. Dùng bản ổn định
      # mới nhất (không phải preview) tại thời điểm verify.
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # "conduit-pool" — cùng 5 deployment trên, gom chung 1 model_name để LiteLLM
  # router tự chọn theo routing_strategy bên dưới (H1, thay cho config.routing-draft.yaml).
  # input_cost_per_token/output_cost_per_token khai tường minh, lấy đúng số đã
  # verify ở docs/model-pricing-sources.md (K2) — bảng giá nội bộ của LiteLLM
  # không có giá chính xác cho "gemini/gemini-flash-latest" (thấy cost-based-routing
  # chọn nhầm gemini-flash dù đắt hơn gpt-4o-mini lúc test 2026-09-29), khai tay
  # để routing quyết định đúng theo giá thật thay vì fallback nội bộ không chuẩn.
  - model_name: conduit-pool
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006
    model_info:
      id: gpt-4o-mini

  - model_name: conduit-pool
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY
      input_cost_per_token: 0.00000075
      output_cost_per_token: 0.00000375
    model_info:
      id: gemini-flash

  - model_name: conduit-pool
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
    model_info:
      id: claude-haiku

  - model_name: conduit-pool
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
    model_info:
      id: gpt-4o

  # claude-sonnet-5 ĐÃ BỊ BỎ khỏi conduit-pool (2026-10-16). Hai lý do đã đo được:
  #   1. Nó bật thinking mặc định và nở phần suy nghĩ cho vừa HẾT max_tokens rồi trả về
  #      RỖNG — thử trực tiếp Anthropic: 512 -> 512 thinking token, 2048 -> 2048 thinking
  #      token, cả 2 lần text rỗng, stop_reason=max_tokens, vẫn bị tính tiền đầy đủ.
  #   2. Nó từ chối tham số `temperature` (HTTP 400 "deprecated for this model"), nên không
  #      áp được greedy decoding mà protocol pass@1 yêu cầu.
  # Giữ nó trong pool là để lại mìn: cost-based-routing bình thường không chọn nó (luôn
  # chọn rẻ nhất), nhưng nếu các model rẻ hơn lỗi thì nó leo tới sonnet -> 400 vì
  # temperature. Tier đắt của thí nghiệm dùng gpt-4o (cũng thuộc tầng đắt, CLAUDE.md mục 2).
  # Alias `claude-sonnet` độc lập ở trên vẫn giữ để gọi tay khi cần.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

router_settings:
  # D2 (docs/roadmap.md mục 4): ưu tiên model rẻ nhất đủ tốt -> cost-based-routing
  # chỉ áp dụng cho nhóm "conduit-pool"; 5 alias riêng lẻ ở trên không bị routing
  # chi phối (gọi thẳng đúng model được chỉ định).
  routing_strategy: cost-based-routing
  # D7 (docs/roadmap.md mục 4): giống hệt 3 proxy.
  num_retries: 2
  timeout: 45
  # TASK-51 (docs/tasks/2026-10-19/tasks.md), bat buoc sau phep thu D15: retry cua model group
  # KHONG thay duoc fallbacks - khi key OpenAI hong, conduit-pool retry lai deployment OpenAI va
  # that bai sau ~40 s (0/15 phuc hoi, experiment-results.md "Phep thu tiem loi"). Fallbacks chuyen
  # sang model group KHAC nha cung cap, uu tien claude-haiku (Gemini ban mien phi hay 503, xem D15:
  # Bifrost phuc hoi 12/13 luot qua claude-haiku).
  # ⚠️ Model group fallback tra header x-litellm-model-id dang hash (deployment rieng le khong dat
  # model_info.id) -> HttpProxyChatClient doc x-litellm-model-group de lay alias, neu khong se ghi
  # model la chuoi hash, khong tim duoc gia, cost = 0 TRONG IM LANG.
  fallbacks:
    - conduit-pool: ["claude-haiku", "gemini-flash"]
  # TASK-51: do 27/10 voi key OpenAI hong - fallbacks CO chay (claude-haiku tra loi trong 0,7 s)
  # nhung chi sau ~46 s, vi LiteLLM retry loi 401 cho toi khi cham timeout 45 s. Backend cung
  # cat ca luot o 45 s (HttpProxyChatClient.REQUEST_TIMEOUT) -> nguoi dung van nhan loi. Loi xac
  # thuc/yeu cau sai la loi VINH VIEN, retry khong bao gio thanh cong -> 0 lan, chuyen ngay sang
  # fallbacks. Loi TAM THOI (timeout, rate limit, 5xx) giu 2 lan nhu D7.
  retry_policy:
    AuthenticationErrorRetries: 0
    BadRequestErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
    TimeoutErrorRetries: 2
    RateLimitErrorRetries: 2
    InternalServerErrorRetries: 2
